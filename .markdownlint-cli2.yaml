config:
  default: true
  MD013: false
  MD033: false

ignores:
  - node_modules
  - CHANGELOG.md
  - .claude
  # OpenSpec's own planning/archive artifacts start with `## Why`/`## Purpose`
  # by the tool's own template convention, not a top-level `#` heading -
  # content nobody reads as prose, not this repo's own documentation.
  - "openspec/**"
  # Vale's style packages, downloaded by `vale sync` - somebody else's
  # docs, held to somebody else's rules.
  - "styles/Google/**"
  - "styles/proselint/**"
