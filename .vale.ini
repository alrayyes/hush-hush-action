StylesPath = styles
MinAlertLevel = warning
Packages = Google, proselint
Vocab = House

[*.md]
BasedOnStyles = Vale, Google, proselint

# The vocabulary already spells every product name the way it's meant to be
# spelled. This is what holds the prose to it, so "Github" and "openapi" get
# flagged where GitHub and OpenAPI are the accepted forms.
Vale.Terms = YES

# Spelling is LTeX's - it uses LanguageTool's real dictionary rather than a
# word list, so it already knows real technical words this list doesn't.
# Two tools underlining the same word teaches people to ignore both.
Vale.Spelling = NO

# Google's style guide bans first person plural. This is a one-maintainer
# project and the docs address "you" throughout, so the rule has nothing to
# catch here and only fires on the odd quoted sentence.
Google.We = NO

# House style spaces em dashes; Google wants them closed up. Not a mistake
# to fix.
Google.EmDash = NO

# SECURITY.md's headings ("Security Policy", "Reporting a Vulnerability")
# follow this account's own required template verbatim - title case there,
# not a violation to flag.
Google.Headings = NO

# House style: punctuation outside the quotation marks unless it was part
# of the quoted text, not American style closing punctuation inside.
Google.Quotes = NO

# LTeX's own ENGLISH_WORD_REPEAT_RULE already catches a genuine repeated
# word ("the the"); this repo's docs also legitimately repeat "Hush" in
# the product name "Hush Hush" itself, which this rule can't tell apart
# from a mistake. Two tools underlining the same class of thing is how a
# team learns to ignore both - turned off here since LTeX's version
# already knows the difference.
Vale.Repetition = NO
