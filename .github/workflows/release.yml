# Nobody picks a version. release-please reads the Conventional Commits that
# land on main and keeps a release pull request open carrying the next
# version and the changelog entry; merging that pull request tags the
# release and writes the notes.
#
# RELEASE_TOKEN, not the default GITHUB_TOKEN: a release-please pull request
# authored by github-actions[bot] sits at action_required with zero jobs run
# on some github.com/alrayyes repos, this one included - confirmed live, the
# mechanism itself still isn't fully understood (alrayyes/dotfiles#483). The
# earlier "no build step, GITHUB_TOKEN is enough" reasoning here didn't hold;
# this repo hit the same wall as every other one that skipped RELEASE_TOKEN.
#
# releases.md says adopt actions/attest-build-provenance unconditionally on
# every GitHub repo - deliberately skipped here rather than silently
# omitted: provenance ties a *built* artifact to the workflow run that
# produced it, and there's no build step, so nothing gets transformed from
# source into something worth attesting. What a consumer pins
# (`uses: alrayyes/hush-hush-action@vX`) is the tagged source tree itself,
# which git's own tag already identifies. Revisit if this repo ever grows a
# build step.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # tags the release and writes it
      pull-requests: write # keeps the release pull request up to date
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
