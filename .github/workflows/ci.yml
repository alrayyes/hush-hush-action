name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile
      - run: bunx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run lint:md
      - name: shellcheck
        run: |
          shopt -s nullglob
          files=(scripts/*.sh tests/integration/*.sh tests/coverage.sh)
          if [ "${#files[@]}" -gt 0 ]; then
            shellcheck -x "${files[@]}"
          fi
      - name: actionlint
        uses: docker://rhysd/actionlint@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 # 1.7.7
        with:
          args: -color
      # dependencies.md: no excuse for a bun-based repo to skip this. Only
      # tooling devDependencies live in package.json, but a CVE in one of
      # them (a supply-chain compromise in a lint tool, say) is still worth
      # catching before it's `bunx`'d in CI or a hook.
      - name: bun audit
        run: bun audit

  # ubuntu-22.04, not ubuntu-latest: kcov isn't packaged for 24.04 at all
  # (confirmed live - "Unable to locate package" even with universe
  # enabled), and 22.04 still carries kcov 38.
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Not `apt-get install bats`: Ubuntu's packaged version is 1.2.1.
      # Pinned to an exact bats-core release instead, same as any other
      # dependency.
      - name: Install bats-core
        run: |
          git clone --quiet --depth 1 --branch v1.14.0 https://github.com/bats-core/bats-core.git /tmp/bats-core
          sudo /tmp/bats-core/install.sh /usr/local
      # --formatter junit, not the default: this file feeds Codecov Test
      # Analytics below. Needs bats 1.10.0+, which is why this job pins an
      # exact bats-core release rather than Ubuntu's 1.2.1.
      - name: bats
        run: bats --formatter junit tests/*.bats > junit-out.xml
      - name: Install kcov
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends kcov
      # scripts/install.sh and scripts/get.sh aren't measured here - see
      # tests/coverage.sh's own comment for why (the real-container
      # integration test exercises them instead).
      - name: Coverage
        run: kcov --include-path=scripts coverage-out bats tests/lib.bats
      # Stage what the reports job publishes. kcov writes one self-contained
      # directory per run, plus a kcov-merged/ that stays empty for a single
      # run, so take the merged report if it has one and the run's own
      # directory if not. Its cobertura.xml becomes coverage.xml and the rest
      # (the HTML tree and kcov's JSON) stays beside it as the native output.
      - name: Stage reports
        run: |
          mkdir -p staged/tests staged/coverage
          cp junit-out.xml staged/tests/unit.xml
          src=
          for dir in coverage-out/kcov-merged coverage-out/*/; do
            if [ -f "$dir/cobertura.xml" ] && [ ! -L "${dir%/}" ]; then
              src=$dir
              break
            fi
          done
          if [ -z "$src" ]; then
            echo "no kcov report with a cobertura.xml in coverage-out" >&2
            exit 1
          fi
          cp -R "$src"/. staged/coverage/
          mv staged/coverage/cobertura.xml staged/coverage/coverage.xml
      - name: Upload staged reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: staged-reports
          path: staged
          retention-days: 7
          if-no-files-found: error
      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage-out/*/cobertura.xml
          fail_ci_if_error: true
      # Codecov Test Analytics: per-test failure/flake detail, not just a
      # coverage delta. `!cancelled()`, not `always()` or the step default -
      # this still runs when the `bats` step above failed (junit-out.xml
      # exists either way; that's the case Test Analytics is actually for),
      # but not if the whole run was cancelled out from under it.
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: junit-out.xml
          report_type: test_results

  # Grammar, spelling, the phonetic article - mechanics have a right answer,
  # so this fails the build. The job's own container is ghcr.io's
  # ltex-cli-plus image, so lint-ltex.sh finds the CLI already on PATH and
  # skips fetching anything.
  mechanics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: ghcr.io/alrayyes/ltex-cli-plus:18.7.0@sha256:00c30809802234d6c43b0ce0b295075bd0aff9c576aaba57433bc8baf314398c
      options: --entrypoint ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ./scripts/lint-ltex.sh

  # Style: house voice, weasel words, corporate speak. Advice rather than a
  # verdict - MinAlertLevel in .vale.ini prints it, and only Vale.Terms
  # (error severity) takes the job down.
  style:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ./scripts/lint-vale.sh

  # Real containers, no mocking: a real hush-hush server, a real Forgejo
  # instance, and a real Forgejo Actions runner, exercising this action the
  # way an actual pipeline would (tests/integration/run.sh).
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends age
      - run: tests/integration/run.sh

  # Assembles site/reports on every run, so a broken step fails the pull
  # request. Only a push to main uploads the Pages artifact.
  reports:
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: staged-reports
          path: site/reports
      - name: Build the reports index
        env:
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          test -s site/reports/tests/unit.xml
          grep -q '<testsuites' site/reports/tests/unit.xml
          test -s site/reports/coverage/index.html
          grep -q '<coverage ' site/reports/coverage/coverage.xml
          cat > site/reports/index.html <<EOF
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>hush-hush-action reports</title>
          </head>
          <body>
          <h1>hush-hush-action reports</h1>
          <p>Commit <a href="https://github.com/${REPO}/commit/${SHA}">${SHA:0:7}</a>, built $(date -u +%Y-%m-%d) at $(date -u +%H:%M) UTC.</p>
          <ul>
          <li><a href="tests/unit.xml">Unit tests</a> (JUnit XML)</li>
          <li><a href="coverage/">Coverage</a> (kcov HTML)</li>
          <li><a href="coverage/coverage.xml">Coverage</a> (Cobertura XML)</li>
          </ul>
          </body>
          </html>
          EOF
          grep -q "${SHA:0:7}" site/reports/index.html
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  # Deploys behind every other job, so the reports describe a green commit.
  # commitlint only runs on pull requests, so it isn't a need here.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [reports, lint, mechanics, style, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      # The deploy succeeds whether or not the file is reachable, so fetch
      # the real one. The retries cover the CDN catching up.
      - name: Verify the live reports
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl --fail --silent --show-error --location --retry 6 --retry-delay 10 --retry-all-errors --output coverage.xml "${PAGE_URL%/}/reports/coverage/coverage.xml"
          grep -q '<coverage ' coverage.xml
          curl --fail --silent --show-error --location --retry 6 --retry-delay 10 --retry-all-errors --output unit.xml "${PAGE_URL%/}/reports/tests/unit.xml"
          grep -q '<testsuites' unit.xml
