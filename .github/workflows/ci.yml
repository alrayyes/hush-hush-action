name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile
      - run: bunx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run lint:md
      - name: shellcheck
        run: |
          shopt -s nullglob
          files=(scripts/*.sh tests/integration/*.sh tests/coverage.sh)
          if [ "${#files[@]}" -gt 0 ]; then
            shellcheck -x "${files[@]}"
          fi
      - name: actionlint
        uses: docker://rhysd/actionlint@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 # 1.7.7
        with:
          args: -color
      # dependencies.md: no excuse for a bun-based repo to skip this. Only
      # tooling devDependencies live in package.json, but a CVE in one of
      # them (a supply-chain compromise in a lint tool, say) is still worth
      # catching before it's `bunx`'d in CI or a hook.
      - name: bun audit
        run: bun audit

  # ubuntu-22.04, not ubuntu-latest: kcov isn't packaged for 24.04 at all
  # (confirmed live - "Unable to locate package" even with universe
  # enabled), and 22.04 still carries kcov 38.
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Not `apt-get install bats`: Ubuntu's packaged version is 1.2.1.
      # Pinned to an exact bats-core release instead, same as any other
      # dependency.
      - name: Install bats-core
        run: |
          git clone --quiet --depth 1 --branch v1.14.0 https://github.com/bats-core/bats-core.git /tmp/bats-core
          sudo /tmp/bats-core/install.sh /usr/local
      - name: bats
        run: bats tests/*.bats
      - name: Install kcov
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends kcov
      # scripts/install.sh and scripts/get.sh aren't measured here - see
      # tests/coverage.sh's own comment for why (the real-container
      # integration test exercises them instead).
      - name: Coverage
        run: kcov --include-path=scripts coverage-out bats tests/lib.bats
      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage-out/*/cobertura.xml
          fail_ci_if_error: true

  # Real containers, no mocking: a real hush-hush server, a real Forgejo
  # instance, and a real Forgejo Actions runner, exercising this action the
  # way an actual pipeline would (tests/integration/run.sh).
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends age
      - run: tests/integration/run.sh
