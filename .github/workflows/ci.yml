name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile
      - run: bunx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run lint:md
      - name: shellcheck
        run: |
          shopt -s nullglob
          files=(scripts/*.sh tests/integration/*.sh)
          if [ "${#files[@]}" -gt 0 ]; then
            shellcheck -x "${files[@]}"
          fi
      - name: actionlint
        uses: docker://rhysd/actionlint@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 # 1.7.7
        with:
          args: -color
      # dependencies.md: no excuse for a bun-based repo to skip this. Only
      # tooling devDependencies live in package.json, but a CVE in one of
      # them (a supply-chain compromise in a lint tool, say) is still worth
      # catching before it's `bunx`'d in CI or a hook.
      - name: bun audit
        run: bun audit

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: bats
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bats
          bats tests/*.bats

  # Real containers, no mocking: a real hush-hush server, a real Forgejo
  # instance, and a real Forgejo Actions runner, exercising this action the
  # way an actual pipeline would (tests/integration/run.sh).
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends age
      - run: tests/integration/run.sh
