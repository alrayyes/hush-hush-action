# Nothing here is JavaScript. package.json exists so commitlint can resolve
# the shared config it extends, which bunx alone cannot do.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Amsterdam
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
      # Grouping (even a group of one) keeps a major bump on Dependabot's
      # lowercase group-title template instead of falling back to its
      # sentence-case single-update one, which fails commitlint's
      # subject-case rule on the raw commit - see rules/releases.md.
      actions-major:
        patterns: ["*"]
        update-types: [major]

  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Amsterdam
    commit-message:
      prefix: chore
      include: scope
    groups:
      tooling:
        patterns: ["*"]
        update-types: [minor, patch]
      tooling-major:
        patterns: ["*"]
        update-types: [major]
