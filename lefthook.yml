# The same commands CI runs, so the two cannot drift. The hook catches it
# early; CI is the gate that cannot be skipped.
#
# pre-commit judges only what the commit contains: every job takes
# {staged_files}, makes no network fetch and reads no whole tree. actionlint
# can't take a file list (it auto-discovers action.yml and the workflows), so
# it runs in pre-push and CI only.

output:
  - failure

pre-commit:
  jobs:
    - name: shellcheck
      glob: "*.sh"
      run: shellcheck -x {staged_files}

    - name: prettier
      glob: "*.{md,yml,yaml}"
      run: bunx prettier --write {staged_files}
      stage_fixed: true

    - name: markdownlint
      glob: "*.md"
      run: bunx markdownlint-cli2 {staged_files}

    # Fast enough for pre-commit per markdown.md; LTeX (slower - it fetches
    # or runs a ~300MB JDK-bundling image) is a pre-push job instead.
    - name: vale
      glob: "*.md"
      run: ./scripts/lint-vale.sh {staged_files}

commit-msg:
  jobs:
    - name: commitlint
      run: bunx commitlint --edit {1}

# pre-push never writes - every job below runs in check mode.
#
# tests/integration/run.sh and tests/coverage.sh are deliberately CI-only,
# not pre-push jobs: the former spins up three real containers and the
# latter installs kcov and bats-core fresh inside an ubuntu:22.04 container
# every run - both take over a minute, versus low single-digit seconds for
# everything else here. Run either by hand before a push that touches
# action.yml or scripts/ - CI runs both unconditionally either way.
pre-push:
  parallel: true
  jobs:
    - name: shellcheck
      run: shellcheck -x scripts/*.sh tests/integration/*.sh tests/coverage.sh

    - name: actionlint
      run: actionlint

    - name: bats
      run: bats tests/*.bats

    - name: prettier
      run: bun run format:check

    - name: markdownlint
      run: bun run lint:md

    - name: vale
      run: ./scripts/lint-vale.sh

    - name: ltex
      run: ./scripts/lint-ltex.sh
